# Personal CD: GitHub → Alibaba ACR → optional SSH restart.
# Official merge-to-main packaging stays in build.yml (GHCR / Tencent CCR).
#
# Image:
#   crpi-dgu2wsvv8dxj63i4.cn-shenzhen.personal.cr.aliyuncs.com/shilijiamaas/novamaas
#
# Fill GitHub Secrets before the first run (Settings → Secrets and variables → Actions):
#   ALIYUN_ACR_USERNAME
#   ALIYUN_ACR_PASSWORD
#   DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY   (only if you tick Deploy)
#
# Optional Variable:
#   DEPLOY_PATH   server directory with docker-compose.yml (default /opt/novamaas)
name: CD Alibaba ACR (with CI Gates)

on:
  push:
    branches: [feat/supplier-test-vendor-profile]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'After pushing the image, SSH to the server and restart the container'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-aliyun-${{ github.repository }}
  cancel-in-progress: false

env:
  GOWORK: 'off'
  ACR_REGISTRY: crpi-dgu2wsvv8dxj63i4.cn-shenzhen.personal.cr.aliyuncs.com
  ACR_NAMESPACE: shilijiamaas
  ACR_REPOSITORY: novamaas

jobs:
  backend-checks:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Prepare embed path
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Vet and test
        run: |
          go vet ./service/suppliertest ./controller ./model
          go test ./service/suppliertest ./controller ./model -count=1

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx oxlint -c .oxlintrc.json src/features/supplier-test
      - run: bun run test -- --pool=threads src/features/supplier-test/baselines.test.ts src/features/supplier-test/vendors.test.ts src/features/supplier-test/layout.test.tsx

  publish:
    name: Build and push ACR
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Require ACR login secrets
        env:
          USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          missing=0
          [ -n "$USERNAME" ] || { echo "Missing secret ALIYUN_ACR_USERNAME"; missing=1; }
          [ -n "$PASSWORD" ] || { echo "Missing secret ALIYUN_ACR_PASSWORD"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Open Settings → Secrets and variables → Actions → Secrets, then re-run."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve image name
        id: meta
        run: |
          tag="sha-${GITHUB_SHA:0:12}"
          image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}"
          echo "image=${image}:${tag}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
          printf 'Publishing %s:%s\n' "$image" "$tag"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push linux/amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:supplier-test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aliyun-amd64
          cache-to: type=gha,mode=min,scope=aliyun-amd64,ignore-error=true

      - name: Write summary
        run: |
          {
            echo "### Pushed ACR image"
            echo
            echo "- \`${{ env.IMAGE }}:${{ env.IMAGE_TAG }}\`"
            echo "- \`${{ env.IMAGE }}:supplier-test\`"
            echo
            echo "On the server:"
            echo
            echo "\`\`\`bash"
            echo "docker login ${ACR_REGISTRY}"
            echo "docker pull ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Restart server container
    needs: publish
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require SSH config
        id: gate
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          WANT_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "Fill DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY in this repository's Actions secrets."
            if [ "$WANT_DEPLOY" = "true" ]; then
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are empty; skipping server restart."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.skip != 'true'
        with:
          persist-credentials: false

      - name: Sync compose and recreate stack
        if: steps.gate.outputs.skip != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PATH_DIR: ${{ vars.DEPLOY_PATH != '' && vars.DEPLOY_PATH || '/opt/novamaas' }}
          IMAGE: ${{ needs.publish.outputs.image }}
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          if ! grep -q "BEGIN .*PRIVATE KEY" "$key_file"; then
            echo "DEPLOY_SSH_KEY is not an OpenSSH private key (need BEGIN/END PRIVATE KEY, not the .pub file)."
            exit 1
          fi
          echo "Checking whether GitHub Actions can reach port 22..."
          if ! timeout 12 bash -c "echo >/dev/tcp/${HOST}/22"; then
            echo "Cannot reach DEPLOY_HOST port 22 from GitHub-hosted runners."
            echo "Open the server security group for TCP 22 (key login only), then re-run."
            exit 1
          fi
          ssh_opts=(
            -i "$key_file"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o BatchMode=yes
            -o ConnectTimeout=15
          )
          ssh "${ssh_opts[@]}" "${USER}@${HOST}" "mkdir -p '$PATH_DIR/data' '$PATH_DIR/logs'"
          scp -O "${ssh_opts[@]}" \
            deploy/aliyun/docker-compose.yml \
            deploy/aliyun/.env.example \
            "${USER}@${HOST}:${PATH_DIR}/"
          ssh "${ssh_opts[@]}" "${USER}@${HOST}" \
            IMAGE="$IMAGE" \
            PATH_DIR="$PATH_DIR" \
            ACR_REGISTRY="$ACR_REGISTRY" \
            ACR_USERNAME="$ACR_USERNAME" \
            ACR_PASSWORD="$ACR_PASSWORD" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
          docker pull "$IMAGE"
          cd "$PATH_DIR"
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          printf 'NOVAMAAS_IMAGE=%s\n' "$IMAGE" > .image.env
          if docker compose version >/dev/null 2>&1; then
            compose=(docker compose)
          elif command -v docker-compose >/dev/null 2>&1; then
            compose=(docker-compose)
          else
            echo "docker compose is not installed on the server"
            exit 1
          fi
          "${compose[@]}" --env-file .env --env-file .image.env up -d
          "${compose[@]}" --env-file .env --env-file .image.env ps
          docker image prune -f >/dev/null 2>&1 || true
          REMOTE
