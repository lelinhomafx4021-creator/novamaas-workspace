# Personal CD: GitHub → Alibaba ACR → optional SSH restart.
# Official merge-to-main packaging stays in build.yml (GHCR / Tencent CCR).
#
# Image:
#   crpi-dgu2wsvv8dxj63i4.cn-shenzhen.personal.cr.aliyuncs.com/shilijiamaas/novamaas
#
# Fill GitHub Secrets before the first run (Settings → Secrets and variables → Actions):
#   ALIYUN_ACR_USERNAME
#   ALIYUN_ACR_PASSWORD
#   DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY   (only if you tick Deploy)
#
# Optional Variable:
#   DEPLOY_PATH   server directory with docker-compose.yml (default /opt/novamaas)
name: CD Alibaba ACR

on:
  push:
    branches: [feat/supplier-test]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'After pushing the image, SSH to the server and restart the container'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-aliyun-${{ github.repository }}
  cancel-in-progress: false

env:
  GOWORK: 'off'
  ACR_REGISTRY: crpi-dgu2wsvv8dxj63i4.cn-shenzhen.personal.cr.aliyuncs.com
  ACR_NAMESPACE: shilijiamaas
  ACR_REPOSITORY: novamaas

jobs:
  publish:
    name: Build and push ACR
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Require ACR login secrets
        env:
          USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          missing=0
          [ -n "$USERNAME" ] || { echo "Missing secret ALIYUN_ACR_USERNAME"; missing=1; }
          [ -n "$PASSWORD" ] || { echo "Missing secret ALIYUN_ACR_PASSWORD"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Open Settings → Secrets and variables → Actions → Secrets, then re-run."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve image name
        id: meta
        run: |
          tag="sha-${GITHUB_SHA:0:12}"
          image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}"
          echo "image=${image}:${tag}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
          printf 'Publishing %s:%s\n' "$image" "$tag"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push linux/amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:supplier-test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aliyun-amd64
          cache-to: type=gha,mode=min,scope=aliyun-amd64,ignore-error=true

      - name: Write summary
        run: |
          {
            echo "### Pushed ACR image"
            echo
            echo "- \`${{ env.IMAGE }}:${{ env.IMAGE_TAG }}\`"
            echo "- \`${{ env.IMAGE }}:supplier-test\`"
            echo
            echo "On the server:"
            echo
            echo "\`\`\`bash"
            echo "docker login ${ACR_REGISTRY}"
            echo "docker pull ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Restart server container
    needs: publish
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require SSH config
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          [ -n "$HOST" ] || { echo "Missing secret DEPLOY_HOST"; missing=1; }
          [ -n "$USER" ] || { echo "Missing secret DEPLOY_USER"; missing=1; }
          [ -n "$KEY" ] || { echo "Missing secret DEPLOY_SSH_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Fill DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY, or re-run without Deploy."
            exit 1
          fi

      - name: Pull image and recreate container
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PATH_DIR: ${{ vars.DEPLOY_PATH != '' && vars.DEPLOY_PATH || '/opt/novamaas' }}
          IMAGE: ${{ needs.publish.outputs.image }}
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          key_file="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "${USER}@${HOST}" \
            IMAGE="$IMAGE" \
            PATH_DIR="$PATH_DIR" \
            ACR_REGISTRY="$ACR_REGISTRY" \
            ACR_USERNAME="$ACR_USERNAME" \
            ACR_PASSWORD="$ACR_PASSWORD" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
          docker pull "$IMAGE"
          mkdir -p "$PATH_DIR"
          cd "$PATH_DIR"
          printf 'NOVAMAAS_IMAGE=%s\n' "$IMAGE" > .image.env
          if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
            docker compose --env-file .image.env up -d
          else
            docker rm -f new-api >/dev/null 2>&1 || true
            docker run -d --name new-api --restart unless-stopped \
              -p 3000:3000 \
              -e TZ=Asia/Shanghai \
              -v "$PATH_DIR/data:/data" \
              "$IMAGE"
          fi
          docker image prune -f >/dev/null 2>&1 || true
          REMOTE
