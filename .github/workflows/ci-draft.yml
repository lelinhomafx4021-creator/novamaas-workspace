# Draft CI/CD for personal forks and the supplier-test branch.
# Official merge-to-main packaging still uses build.yml (GHCR / CCR).
# This file does not SSH to any server and does not need a machine password.
name: CI draft

on:
  push:
    branches: [main, feat/supplier-test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-draft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'

jobs:
  backend:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Prepare embed path
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Vet and test supplier-test surface
        run: |
          go vet ./service/suppliertest ./controller ./model
          go test ./service/suppliertest ./controller ./model -count=1

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx oxlint -c .oxlintrc.json src/features/supplier-test
      - run: bun run test -- --pool=threads src/features/supplier-test/baselines.test.ts

  cd-stub:
    name: CD stub (not wired)
    needs: [backend, frontend]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print how to wire deploy later
        env:
          HAS_HOST: ${{ secrets.DEPLOY_HOST != '' }}
        run: |
          echo "CD is a stub. No SSH and no password."
          echo "Later: Settings → Secrets → Actions → DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY"
          echo "Host secret present: $HAS_HOST"
          if [ "$HAS_HOST" != "true" ]; then
            echo "Skipping real deploy."
          fi
