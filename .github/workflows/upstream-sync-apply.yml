name: Upstream sync · Apply plan

on:
  workflow_dispatch:
    inputs:
      plan_ref:
        description: 'Reviewed codex/upstream-plan-* branch, or its full commit SHA'
        required: true
        type: string
      plan_path:
        description: 'Committed plan: docs/upstream-sync/plans/<batch>/plan.json'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-apply-${{ github.event.inputs.plan_ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply selected items and validate without write credentials
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GOWORK: 'off'
      GIT_TERMINAL_PROMPT: '0'
      GIT_AUTHOR_NAME: 'github-actions[bot]'
      GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
      GIT_COMMITTER_NAME: 'github-actions[bot]'
      GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
      PLAN_REF: ${{ inputs.plan_ref }}
      PLAN_PATH: ${{ inputs.plan_path }}
    steps:
      - name: Check out trusted executor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Validate plan reference and path
        run: python3 trusted/.github/scripts/upstream_sync_ci.py inspect-input --mode apply
      - name: Check out pinned current downstream base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Read planning branch without running its code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.plan_ref }}
          path: plan
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.10.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.1'
          cache: false
      - name: Apply, build, test and finalize provenance
        run: python3 trusted/.github/scripts/upstream_sync_ci.py apply --trusted trusted --source source --plan-root plan --candidate candidate --output publication
      - name: Preserve execution and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-sync-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication/result.json
            publication/verification.json
            publication/*.log
          if-no-files-found: warn
          retention-days: 30
      - name: Store verified publication input from this run
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-apply-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication/changes.patch
            publication/publication.json
            publication/candidate.bundle
            publication/result.json
            publication/verification.json
          if-no-files-found: error
          retention-days: 7

  publish-implementation:
    name: Open implementation draft PR without executing adopted code
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_AUTHOR_NAME: 'github-actions[bot]'
      GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
      GIT_COMMITTER_NAME: 'github-actions[bot]'
      GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PLAN_REF: ${{ inputs.plan_ref }}
      PLAN_PATH: ${{ inputs.plan_path }}
    steps:
      - name: Check out trusted publisher only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: publisher
          persist-credentials: false
      - name: Download only the verified artifact produced above
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.apply.outputs.artifact_id }}
          path: publication
          merge-multiple: true
      - name: Publish implementation branch and draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publisher/.github/scripts/upstream_sync_ci.py publish --source publisher --output publication
