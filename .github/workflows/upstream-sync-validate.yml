name: Upstream sync · Validate PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: upstream-sync-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate current sync PR HEAD
    if: startsWith(github.event.pull_request.head.ref, 'codex/upstream-apply-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOWORK: 'off'
      GIT_TERMINAL_PROMPT: '0'
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out trusted base-branch tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact candidate HEAD without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.10.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.1'
          cache: false
      - name: Revalidate the current implementation and retain provenance records
        run: python3 trusted/.github/scripts/upstream_sync_ci.py revalidate --trusted trusted --candidate candidate --output verification
      - name: Preserve current-HEAD evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-sync-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: verification/verification.json
          if-no-files-found: warn
          retention-days: 14
